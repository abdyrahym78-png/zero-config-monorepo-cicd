[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monoci"

version = "1.0.0"
description = "Zero-config Monorepo CI/CD CLI Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
monoci = "monoci.cli:app"

